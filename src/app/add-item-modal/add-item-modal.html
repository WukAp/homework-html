<div id="add-item-modal" tabindex="-1" aria-hidden="true" class="hidden z-50 fixed inset-0 text-[var(--text-color)]">
    <div class="flex flex-col gap-4 w-[416px] p-5 h-min bg-white">
        <header class="modal-header flex justify-between border-b border-solid border-[var(--splitter-color)]">
            <h1 class="text-xl font-semibold">
                Add data
            </h1>
            <button type="button" data-modal-hide="add-item-modal">
                <img src="../../resources/cross.svg" alt="Close">
            </button>
        </header>
        <div class="input-container">
            <label for="transaction">Transaction</label>
            <input type="text" id="transaction" class="input" placeholder="My transaction" required/>
        </div>
        <div class="input-container">
            <label for="amount">Amount</label>
            <input type="number" id="amount" class="input" placeholder="2300" required/>
        </div>

        <footer>
            <button data-modal-hide="add-item-modal" type="button" class="button w-full">
                Add
            </button>
        </footer>
    </div>
</div>
